baseURL = 'https://dhitvo.github.io/'
title = 'Dhitvo 的技术札记'
theme = 'PaperMod'

# 开启多语言支持
[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1

  [languages.zh]
    languageName = "中文"
    contentDir = "content/zh"
    weight = 2

[params]
  # 这里设置主页信息（支持根据语言显示不同内容）
  [languages.en.params.homeInfoParams]
    Title = "Hi, I am Dhitvo"
    Content = "Technical Consulting | AI Agent Deployment | Go-Global Solutions. Documenting technical insights and industrial practices."

  [languages.zh.params.homeInfoParams]
    Title = "Hi, 我是 Dhitvo"
    Content = "技术咨询 | AI 代理部署 | 出海方案。在这里记录技术避坑心得与工业实践。"

[menu]
  # 你也可以根据语言定义菜单
  [[languages.en.menu.main]]
    name = "Posts"
    url = "posts/"
    weight = 10
  [[languages.zh.menu.main]]
    name = "文章"
    url = "posts/"
    weight = 10